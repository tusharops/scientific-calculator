<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="calculator">

        <!-- ===============================
             HEADER
        ================================ -->

        <div class="top-header">

            <h1>Scientific Calculator</h1>

            <button class="theme-btn" onclick="toggleTheme()" id="themeButton">

                🌙

            </button>

        </div>


        <!-- ===============================
             DISPLAY
        ================================ -->

        <input type="text" id="display" value="0" readonly>


        <!-- ===============================
             SCIENTIFIC BUTTONS
        ================================ -->

        <div class="scientific-buttons">

            <button onclick="square()">x²</button>

            <button onclick="squareRoot()">√</button>

            <button onclick="power()">xʸ</button>

            <button onclick="modulus()">MOD</button>

            <button onclick="sinValue()">sin</button>

            <button onclick="cosValue()">cos</button>

            <button onclick="tanValue()">tan</button>

            <button onclick="logValue()">log</button>

        </div>


        <!-- ===============================
             CALCULATOR BUTTONS
        ================================ -->

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">

                C

            </button>

            <button onclick="deleteNumber()">

                ⌫

            </button>

            <button onclick="percentage()">

                %

            </button>

            <button class="operator" onclick="setOperator('/')">

                ÷

            </button>


            <button onclick="addNumber('7')">

                7

            </button>

            <button onclick="addNumber('8')">

                8

            </button>

            <button onclick="addNumber('9')">

                9

            </button>

            <button class="operator" onclick="setOperator('*')">

                ×

            </button>


            <button onclick="addNumber('4')">

                4

            </button>

            <button onclick="addNumber('5')">

                5

            </button>

            <button onclick="addNumber('6')">

                6

            </button>

            <button class="operator" onclick="setOperator('-')">

                −

            </button>


            <button onclick="addNumber('1')">

                1

            </button>

            <button onclick="addNumber('2')">

                2

            </button>

            <button onclick="addNumber('3')">

                3

            </button>

            <button class="operator" onclick="setOperator('+')">

                +

            </button>


            <button class="zero" onclick="addNumber('0')">

                0

            </button>

            <button onclick="addNumber('.')">

                .

            </button>

            <button class="equal" onclick="calculate()">

                =

            </button>

        </div>


        <!-- ===============================
             HISTORY
        ================================ -->

        <div class="history-panel">

            <div class="history-header">

                <h3>📜 History</h3>

                <button onclick="clearHistory()">

                    Clear

                </button>

            </div>


            <div id="history-list">

                <p class="no-history">

                    No calculations yet

                </p>

            </div>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
